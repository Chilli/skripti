<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Skripti matrix logo</title>
  <desc id="desc">A stylized digital matrix-inspired logo with non-green neon tones.</desc>

  <rect x="24" y="24" width="464" height="464" rx="132" fill="#0E1422"/>

