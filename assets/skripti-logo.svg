  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="700" letter-spacing="-0.04em">
    <text x="144" y="154" fill="#8CCBFF">01</text>
    <text x="232" y="154" fill="#F4B860">{ }</text>
    <text x="304" y="154" fill="#FF8FA3">[]</text>

